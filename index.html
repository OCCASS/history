<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хронограф</title>
<meta name="description" content="Подготовка к экзамену «История России» (НИУ ВШЭ): карточки, конспекты и тесты в формате экзамена по 22 главам учебника под ред. Ю. А. Петрова.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
:root{
  --paper:#EEF1F0; --surface:#FBFCFB; --surface-2:#E4E9E8; --ink:#15191D; --ink-2:#39424B; --muted:#5E6873;
  --line:#D3D9D8; --line-strong:#AEB8B7;
  --accent:#2344A8; --accent-ink:#FFFFFF; --accent-soft:#DDE4F6;
  --good:#1F7A4D; --good-soft:#D9EFE3; --bad:#B3261E; --bad-soft:#F7DEDB; --warn:#9A6400; --warn-soft:#F5E9CF;
  --ribbon-ink:#FFFFFF; --p0:#5E6873; --p1:#A8741F; --p2:#8A4F7D; --p3:#2C7A6A; --p4:#2344A8; --p5:#B3402E; --p6:#4C6274;
  --shadow:0 1px 0 rgba(21,25,29,.06),0 8px 24px -12px rgba(21,25,29,.25);
  --f-display:"Oranienbaum","Playfair Display","Times New Roman",serif;
  --f-body:"Golos Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101316; --surface:#181C21; --surface-2:#222830; --ink:#E7EAED; --ink-2:#C3CAD1; --muted:#909AA5;
    --line:#2B323A; --line-strong:#46505B;
    --accent:#8FA8F2; --accent-ink:#0E1420; --accent-soft:#1F2A45;
    --good:#5DC08D; --good-soft:#15301F; --bad:#F08A80; --bad-soft:#3A1C1A; --warn:#E0B458; --warn-soft:#352A12;
    --ribbon-ink:#101316; --p0:#909AA5; --p1:#D9A551; --p2:#C98DBB; --p3:#5FBFA9; --p4:#8FA8F2; --p5:#EE8069; --p6:#8FA7BA;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#101316; --surface:#181C21; --surface-2:#222830; --ink:#E7EAED; --ink-2:#C3CAD1; --muted:#909AA5;
  --line:#2B323A; --line-strong:#46505B;
  --accent:#8FA8F2; --accent-ink:#0E1420; --accent-soft:#1F2A45;
  --good:#5DC08D; --good-soft:#15301F; --bad:#F08A80; --bad-soft:#3A1C1A; --warn:#E0B458; --warn-soft:#352A12;
  --ribbon-ink:#101316; --p0:#909AA5; --p1:#D9A551; --p2:#C98DBB; --p3:#5FBFA9; --p4:#8FA8F2; --p5:#EE8069; --p6:#8FA7BA;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;padding-inline:16px;padding-block:0 96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:34px;line-height:1.1}
h2{font-size:26px;line-height:1.15}
h3{font-size:20px;line-height:1.2}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
b,strong{font-weight:600}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0}
.brand .word{font-family:var(--f-display);font-size:26px;line-height:1;letter-spacing:.02em}
.brand .sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:14px}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabbar{display:none}
@media (max-width:720px){
  .tabs{display:none}
  .brand .sub{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;border-radius:8px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  h1{font-size:29px}
}

main{padding-block:22px 24px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.section{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:10px 14px;font-weight:500;font-size:14.5px;min-height:42px;text-align:center}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--ink-2);min-height:32px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tag .sw{width:8px;height:8px;border-radius:2px}

/* period ribbon */
.ribbon{display:flex;flex-direction:column;gap:6px}
.ribbon-bar{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.ribbon-bar button{border:0;padding:0 6px;box-shadow:inset -1px 0 0 rgba(255,255,255,.35);color:var(--ribbon-ink);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:flex-start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.ribbon-bar button:hover{filter:brightness(1.1)}
.ribbon-bar button span{overflow:hidden;text-overflow:ellipsis}
.ribbon-scale{display:flex}
.ribbon-scale span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border-left:1px solid var(--line-strong);padding-left:4px;line-height:1.1;overflow:hidden}

/* stat line */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stats > div{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stats > div + div{border-left:1px solid var(--line)}
.stats .v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stats .k{font-size:12.5px;color:var(--muted);line-height:1.3}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* actions grid */
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.action{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:108px}
.action:hover{border-color:var(--line-strong)}
.action .t{font-family:var(--f-display);font-size:21px;line-height:1.1}
.action .d{font-size:13px;color:var(--muted);line-height:1.4}
.action.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.action.lead .d{color:color-mix(in srgb,var(--accent-ink) 78%,transparent)}
@media (max-width:420px){.actions{grid-template-columns:1fr}.action{min-height:0}}

/* chapter list */
.period-head{display:flex;align-items:baseline;gap:10px;padding-top:6px}
.period-head .sw{width:10px;height:10px;border-radius:2px;flex:none;transform:translateY(-1px)}
.period-head h3{font-size:19px}
.period-head .yrs{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.chlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.chrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 14px;background:none;border:0;text-align:left;width:100%}
.chrow + .chrow{border-top:1px solid var(--line)}
.chrow:hover{background:var(--surface-2)}
.chrow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chrow .ti{font-size:14.5px;font-weight:500;line-height:1.3}
.chrow .pr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:64px}
.chrow .pr .bar{width:64px;height:4px}
.chrow .pr small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.stk{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left;width:100%}
.stk + .stk{border-top:1px solid var(--line)}
.stk:hover{background:var(--surface-2)}
.stk .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line-strong);color:var(--muted)}
.stk.seen .no{border-color:var(--accent);color:var(--accent)}
.stk.now .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stk.done .no{background:var(--good);border-color:var(--good);color:var(--paper)}
.stk .ti{display:block;font-size:14.5px;font-weight:500;line-height:1.3}
.stk .sub{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px}
.stk .pr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:64px}
.stk .pr .bar{width:64px;height:4px}
.stk .pr small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
@media (max-width:560px){.stk{grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:11px 12px}
  .stk .pr{min-width:46px}.stk .pr .bar{width:46px}}

/* scope picker */
.scope{display:flex;flex-direction:column;gap:10px}
.scope details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.scope summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.scope summary::-webkit-details-marker{display:none}
.scope summary .v{margin-left:auto;color:var(--muted);font-weight:400;font-size:13px;text-align:right}
.scope summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-3px);margin-left:4px;flex:none}
.scope details[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.scope .body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.chk{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:13.5px;line-height:1.35;padding:3px 0}
.chk input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--accent)}

/* flashcard: library catalogue card */
.card-stage{display:flex;flex-direction:column;gap:14px}
.fc{position:relative;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);min-height:330px;padding:18px 20px 34px;display:flex;flex-direction:column;gap:14px;cursor:pointer;user-select:text;border-top:5px solid var(--pc,var(--accent))}
.fc::before{content:"";position:absolute;left:0;right:0;top:44px;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.fc::after{content:"";position:absolute;left:50%;bottom:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--paper);border:1px solid var(--line-strong)}
.fc .shelf{display:flex;justify-content:space-between;gap:10px;height:18px;align-items:center}
.fc .shelf .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.fc .front-title{font-family:var(--f-display);font-size:30px;line-height:1.12;text-wrap:balance;margin-top:14px}
.fc .hint{font-size:13px;color:var(--muted)}
.fc .flip-note{margin-top:auto;font-size:12.5px;color:var(--muted);text-align:center}
.fc .back{display:flex;flex-direction:column;gap:12px}
.fc .back-title{font-family:var(--f-display);font-size:23px;line-height:1.15;text-wrap:balance}
.stamp{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:500;font-size:17px;color:var(--pc,var(--accent));border:1.5px solid var(--pc,var(--accent));border-radius:4px;padding:3px 10px;box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px color-mix(in srgb,var(--pc,var(--accent)) 50%,transparent);letter-spacing:.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.kv dd{margin:0}
.fc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.fc .desc{font-size:15px;line-height:1.55}
.fc .look{font-size:13.5px;background:var(--surface-2);border-radius:6px;padding:8px 10px;line-height:1.45}
.fc img,.q-img{max-width:100%;height:auto;border-radius:4px;border:1px solid var(--line);display:block}
.fc .front-img{max-height:260px;width:auto;margin:6px auto 0}
.fc .exam-hook{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line-strong);padding-top:12px;font-size:14px;line-height:1.45}
.fc .exam-hook img{max-height:200px;width:auto;align-self:flex-start}
.fc .exam-hook .chain .me,.fc .exam-hook .chain .me .y{color:var(--pc,var(--accent));font-weight:600}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:0;line-height:1.2;padding:8px 6px}
.rate .btn small{font-size:11px;font-weight:400;color:var(--muted)}
.rate .no{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.rate .mid{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.rate .yes{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.rate .no:hover{background:var(--bad-soft)} .rate .mid:hover{background:var(--warn-soft)} .rate .yes:hover{background:var(--good-soft)}
.progress-line{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.progress-line .bar{flex:1}
.boxes{display:flex;gap:3px}
.boxes i{width:10px;height:10px;border-radius:2px;border:1px solid var(--line-strong)}
.boxes i.on{background:var(--good);border-color:var(--good)}

/* test */
.q{display:flex;flex-direction:column;gap:14px}
.q-text{font-size:18px;font-weight:500;line-height:1.4;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:11px 14px;font-size:15px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--ink-2)}
.opt .let{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:1px}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .let{color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .let{color:var(--bad)}
.seq{display:flex;flex-direction:column;gap:8px}
.seq-item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:15px;line-height:1.35}
.seq-item .num{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--line-strong);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.seq-item.set .num{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.seq-item .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.seq-item.ok{border-color:var(--good);background:var(--good-soft)} .seq-item.ok .num{background:var(--good);border-color:var(--good);color:var(--surface)}
.seq-item.bad{border-color:var(--bad);background:var(--bad-soft)} .seq-item.bad .num{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.answer-line{font-size:14px;line-height:1.5;border-left:3px solid var(--good);padding:6px 0 6px 12px}
.answer-line.bad{border-left-color:var(--bad)}
.verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.chain{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14px}
.chain .arrow{color:var(--muted)}
.chain span.y{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.explain-ai{font-size:14.5px;line-height:1.6;background:var(--accent-soft);border-radius:8px;padding:12px 14px;white-space:pre-wrap}
.score{font-family:var(--f-display);font-size:64px;line-height:1}
.mistake{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.mistake .qq{font-weight:500}
.mistake .aa{font-size:14px}

/* rulers timeline */
.tl{display:flex;flex-direction:column}
.tl-period{display:flex;flex-direction:column;gap:0;margin-bottom:18px}
.tl-period > header{display:flex;align-items:baseline;gap:10px;padding:0 0 8px}
.tl-period > header .sw{width:10px;height:10px;border-radius:2px;transform:translateY(-1px)}
.tl-list{border-left:2px solid var(--pc);margin-left:4px;display:flex;flex-direction:column}
.ruler{position:relative;padding-left:16px}
.ruler::before{content:"";position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--pc)}
.ruler > button{display:grid;grid-template-columns:112px 1fr auto;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:10px 6px;border-radius:8px}
.ruler > button:hover{background:var(--surface-2)}
.ruler .yrs{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ruler .nm{font-family:var(--f-display);font-size:19px;line-height:1.15}
.ruler .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ruler .more{padding:2px 6px 14px;display:flex;flex-direction:column;gap:10px}
.evlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}

.summary{display:flex;flex-direction:column;gap:12px}

  <div class="wrap">

<script src="data.js"></script>
<script src="core.js"></script>
<script>
(function(){
"use strict";
const D = window.HDATA;
const $app = document.getElementById('app');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const norm = s => String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"().,:;!?–-]/g,' ').replace(/\s+/g,' ').trim();
const plural = (n, a, b, c) => { const m10=n%10, m100=n%100; return (m10===1&&m100!==11)?a:(m10>=2&&m10<=4&&(m100<10||m100>=20))?b:c; };
const LET = ['a','b','c','d'];

/* ---------- store (per-browser) ---------- */
const KEY = 'hronograf.v1';
let S = { box:{}, seen:{}, wrong:[], tests:[], scope:null, cats:null, dir:'fwd', size:20, core:0, mode:'top' };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- data index ---------- */
const RUL = {}; D.rulers.forEach((r,i)=>{ RUL[r.id] = Object.assign({}, r, {idx:i}); });
const PER = D.periods;
const CHS = D.chapters.slice().sort((a,b)=>a.chapter-b.chapter);
const CHN = {}; CHS.forEach(c=>CHN[c.chapter]=c);
const ALL_CH = CHS.map(c=>c.chapter);
const pc = n => `var(--p${n})`;
const chColor = ch => pc(CHN[ch] ? CHN[ch].period : 0);

const CATS = [
  {id:'rulers', label:'Правители', hint:'периоды по правителям'},
  {id:'people', label:'Персоны', hint:'действующие лица и их роли'},
  {id:'internal', label:'Внутренняя политика', hint:'события и реформы'},
  {id:'foreign', label:'Внешняя политика', hint:'войны, битвы, договоры'},
  {id:'culture', label:'Культура', hint:'памятники, произведения, артефакты'},
  {id:'terms', label:'Понятия', hint:'термины'}
];
const CATL = Object.fromEntries(CATS.map(c=>[c.id,c.label]));
if (!S.scope) S.scope = ALL_CH.slice();
if (!S.cats) S.cats = CATS.map(c=>c.id);

// flat cards
const CARDS = []; const CARD = {};
const rulerEvents = {};   // ruler id -> events (all chapters, deduped)
const rulerNotes = {};
const rulerChapters = {};
const seenEvTitle = new Set();
CHS.forEach(ch => {
  const n = ch.chapter;
  Object.entries(ch.ruler_notes||{}).forEach(([id,t])=>{ (rulerNotes[id] = rulerNotes[id]||[]).push(t); });
  (ch.events||[]).forEach(e => {
    const c = {key:'e:'+e.id, kind:'event', cat:e.type, ch:n, title:e.title, d:e};
    CARDS.push(c);
    if (e.ruler){
      (rulerChapters[e.ruler] = rulerChapters[e.ruler]||new Set()).add(n);
      const k = e.ruler+'|'+norm(e.title);
      if (!seenEvTitle.has(k)){ seenEvTitle.add(k); (rulerEvents[e.ruler] = rulerEvents[e.ruler]||[]).push(Object.assign({ch:n}, e)); }
    }
  });
  (ch.people||[]).forEach(p => CARDS.push({key:'p:'+p.id, kind:'person', cat:'people', ch:n, title:p.name, d:p}));
  (ch.culture||[]).forEach(p => CARDS.push({key:'c:'+p.id, kind:'culture', cat:'culture', ch:n, title:p.title, d:p}));
  (ch.terms||[]).forEach((t,i) => CARDS.push({key:'t:'+n+':'+i, kind:'term', cat:'terms', ch:n, title:t.term, d:t}));
});
Object.values(rulerEvents).forEach(l => l.sort((a,b)=>(a.year-b.year)||((a.month||0)-(b.month||0))));
D.rulers.forEach(r => {
  const chs = [...(rulerChapters[r.id]||[])];
  if (!chs.length) return;
  CARDS.push({key:'r:'+r.id, kind:'ruler', cat:'rulers', ch:Math.min(...chs), chs, title:r.name, d:RUL[r.id]});
});
CARDS.forEach(c=>CARD[c.key]=c);

// ядро: карточки, отобранные по спросу банка вопросов (core.js)
const HC = window.HCORE || null;
const CORE = {
  150: new Set(HC && HC.core150 ? HC.core150.keys : []),
  300: new Set(HC && HC.core300 ? HC.core300.keys : [])
};
const CORE_COV = {150: HC && HC.core150 ? HC.core150.coverage : 0, 300: HC && HC.core300 ? HC.core300.coverage : 0};
const hasCore = CORE[300].size > 0;
if (!hasCore) S.core = 0;
const coreSet = () => (S.core && CORE[S.core] && CORE[S.core].size) ? CORE[S.core] : null;

// стопки: то же ядро, разложенное на тематические порции по 13–28 карточек (core.js)
const BLOCKS = (HC && HC.blocks ? HC.blocks : [])
  .map(b => Object.assign({}, b, {cards: b.keys.map(k => CARD[k]).filter(Boolean)}))
  .filter(b => b.cards.length);
const hasBlocks = BLOCKS.length > 0;
const CORE_TOTAL = BLOCKS.reduce((s,b)=>s+b.cards.length, 0);
const blockByN = n => BLOCKS.find(b => b.n === n) || null;
if (!hasBlocks && S.mode === 'blocks') S.mode = 'free';

// топ-40: карточки, которыми решаются все 14 заданий прошлого варианта 26.06.26 (core.js, tools/gen-top40.py)
const TOP = (HC && HC.top40 ? HC.top40.cards : []).filter(x => CARD[x.key]);
const TOP_CARDS = TOP.map(x => CARD[x.key]);
const TOP_BY_KEY = Object.fromEntries(TOP.map(x => [x.key, x]));
const hasTop = TOP_CARDS.length > 0 && !!D.pastExam;
const PAST_N = D.pastExam ? D.pastExam.mcq.length + D.pastExam.seq.length : 0;
if (!hasTop && S.mode === 'top') S.mode = hasBlocks ? 'blocks' : 'free';

function blockStats(b){
  let l = 0, mid = 0, seen = 0;
  b.cards.forEach(c => { const x = S.box[c.key] || 0; if (x >= 3) l++; else if (x > 0) mid++; if (S.seen[c.key]) seen++; });
  return {total:b.cards.length, learned:l, mid, seen, left:b.cards.length - l};
}
// полоса прогресса: выученное – цветом, начатое – бледной заливкой
function progBar(color, st){
  const done = st.total ? st.learned/st.total*100 : 0, started = st.total ? (st.learned+st.mid)/st.total*100 : 0;
  return `<div class="bar" style="background:linear-gradient(to right,color-mix(in srgb,${color} 30%,var(--surface-2)) 0 ${started}%,var(--surface-2) ${started}% 100%)"><i style="width:${done}%;background:${color}"></i></div>`;
}
const blockBar = (b, st) => progBar(pc(b.per), st);
// текущая стопка: первая непройденная, иначе первая невыученная, иначе последняя
function currentBlock(){
  return BLOCKS.find(b => blockStats(b).seen < b.cards.length)
      || BLOCKS.find(b => blockStats(b).learned < b.cards.length)
      || BLOCKS[BLOCKS.length-1];
}
// сколько карточек даёт уровень k, если взять все главы и все категории
function coreSize(k){ const was = S.core; S.core = k; const n = deckFor(ALL_CH, CATS.map(c=>c.id)).length; S.core = was; return n; }

const inScope = (c, scope) => c.chs ? c.chs.some(x=>scope.includes(x)) : scope.includes(c.ch);
function deckFor(scope, cats){
  const cs = coreSet();
  const seen = new Set(); const out = [];
  CARDS.forEach(c => {
    if (cs && !cs.has(c.key)) return;
    if (!cats.includes(c.cat) || !inScope(c, scope)) return;
    const k = c.kind+'|'+norm(c.title);
    if (seen.has(k)) return; seen.add(k); out.push(c);
  });
  return out;
}
const learned = c => (S.box[c.key]||0) >= 3;
function chapterStats(n){
  const d = deckFor([n], CATS.map(c=>c.id)).filter(c=>c.kind!=='ruler');
  const l = d.filter(learned).length;
  return {total:d.length, learned:l};
}

/* ---------- navigation ---------- */
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="6" width="14" height="13" rx="1.5"/><path d="M7 3.5h12a1.5 1.5 0 0 1 1.5 1.5v11"/><circle cx="10.5" cy="16" r="1"/></svg>',
  test:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h14v16H5z"/><path d="m8 9 1.5 1.5L12 8M8 15l1.5 1.5L12 14M14 9.5h2.5M14 15.5h2.5"/></svg>',
  rulers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3v18"/><circle cx="6" cy="6" r="2" fill="currentColor"/><circle cx="6" cy="12" r="2" fill="currentColor"/><circle cx="6" cy="18" r="2" fill="currentColor"/><path d="M10 6h10M10 12h8M10 18h10"/></svg>',
  notes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14C9.5 18 6.5 18 4 19.5z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>'
};
const VIEWS = [
  {id:'home', label:'Главная'}, {id:'cards', label:'Карточки'}, {id:'test', label:'Тест'},
  {id:'rulers', label:'Правители'}, {id:'notes', label:'Конспекты'}
];
let view = 'home', viewArg = null;
function nav(v, arg){ if (view==='test' && v!=='test' && test && test.i>=test.qs.length) test = null; view = v; viewArg = arg ?? null; render(); window.scrollTo({top:0}); }
function renderNav(){
  document.getElementById('tabs').innerHTML = VIEWS.map(v=>`<button class="tab" type="button" data-nav="${v.id}" ${view===v.id?'aria-current="page"':''}>${v.label}</button>`).join('');
  document.getElementById('tabbar').innerHTML = VIEWS.map(v=>`<button type="button" data-nav="${v.id}" ${view===v.id?'aria-current="page"':''}>${ICONS[v.id]}<span>${v.label}</span></button>`).join('');
}
document.addEventListener('click', e => {
  const tp = e.target.closest('[data-go-top]');
  if (tp){ e.preventDefault(); openTop(); return; }
  const g = e.target.closest('[data-go-core]');
  if (g){ e.preventDefault(); startCore(+g.dataset.goCore); return; }
  const st = e.target.closest('[data-stack]');
  if (st){ e.preventDefault(); openStacks(+st.dataset.stack); return; }
  const md = e.target.closest('[data-mode]');
  if (md){ e.preventDefault(); S.mode = md.dataset.mode; save(); openBlock = null; session = null; view = 'cards'; viewArg = null; render(); window.scrollTo({top:0}); return; }
  const b = e.target.closest('[data-nav]');
  if (b){ e.preventDefault(); const a = b.dataset.arg; nav(b.dataset.nav, a!==undefined ? (isNaN(+a)? a : +a) : null); }
});
// открыть ядро: с главной, из «72 часов» или по ссылке #core300 / #core150
function startCore(k){
  if (hasBlocks && k === 300) return openStacks();
  if (!hasCore) return;
  S.core = k; S.mode = 'free'; S.scope = ALL_CH.slice(); S.cats = CATS.map(c=>c.id); save();
  session = buildSession();
  view = 'cards'; viewArg = null; render(); window.scrollTo({top:0});
}
// открыть топ-40: с главной или по ссылке #top40
function openTop(){
  if (!hasTop) return;
  S.mode = 'top'; save();
  openBlock = null; session = null; view = 'cards'; viewArg = null; render(); window.scrollTo({top:0});
}
// открыть путь по стопкам ядра (без аргумента – список, с номером – саму стопку)
function openStacks(n){
  if (!hasBlocks) return;
  S.mode = 'blocks'; save();
  openBlock = n ? blockByN(n) : null;
  session = null; view = 'cards'; viewArg = null; render(); window.scrollTo({top:0});
}
document.getElementById('brand').onclick = () => nav('home');

/* ---------- Claude explain (optional) ---------- */
let SAMPLE = null;
try {
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(s => { SAMPLE = s || null; if (SAMPLE) document.querySelectorAll('[data-ai-slot]').forEach(el=>el.hidden=false); }).catch(()=>{});
  }
} catch(e) {}
const AI_RULES = 'Ты – доброжелательный преподаватель истории России. Студент готовится к экзамену по курсу «История России» (НИУ ВШЭ, учебник под ред. Ю. А. Петрова, 2024) и начинает почти с нуля. Объясни тему ниже простым языком: сначала контекст (что было до и почему это произошло), затем суть, затем последствия и значение, в конце – короткий приём, как запомнить дату или факт. 6–10 предложений, обычный текст без заголовков, markdown и маркированных списков, по-русски. Вместо длинного тире используй короткое «–». Не выдумывай фактов: если не уверен в детали, опусти её.';
function aiSlot(prompt){
  const id = 'ai'+Math.random().toString(36).slice(2,8);
  AI_PROMPTS[id] = prompt;
  return `<div data-ai-slot ${SAMPLE?'':'hidden'} class="stack" style="gap:8px"><button class="btn ghost" type="button" data-ai="${id}" style="align-self:flex-start">Объяснить подробнее</button><div id="${id}-out" hidden class="explain-ai"></div></div>`;
}
const AI_PROMPTS = {};
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-ai]'); if (!b || !SAMPLE) return;
  e.stopPropagation();
  const id = b.dataset.ai, out = document.getElementById(id+'-out');
  b.disabled = true; out.hidden = false; out.textContent = 'Думаю…';
  try {
    await SAMPLE(AI_RULES + '\n\n' + AI_PROMPTS[id], { onText: ({text}) => { out.textContent = text.replace(/—/g,'–'); } });
    b.hidden = true;
  } catch(err) {
    const code = err && err.code;
    if (code === 'not_granted') { out.textContent = 'Объяснения от Claude отключены для этой страницы.'; document.querySelectorAll('[data-ai-slot]').forEach(el=>{ if(!el.contains(out)) el.hidden=true; }); SAMPLE = null; }
    else if (code === 'rate_limited') { out.textContent = 'Слишком много запросов подряд. Попробуйте через минуту.'; b.disabled = false; }
    else if (code === 'cancelled') { out.textContent = err.text || ''; b.disabled = false; }
    else { out.textContent = (err && err.text) ? err.text : 'Не получилось получить объяснение. Попробуйте ещё раз.'; b.disabled = false; }
  }
});

/* ---------- shared UI bits ---------- */
function periodRibbon(){
  const ps = PER.filter(p=>p.from);
  const fx = p => `flex:${p.to-p.from} 1 0;min-width:${p.to-p.from<120?46:0}px`;
  const bar = ps.map(p => `<button type="button" style="${fx(p)};background:${pc(p.n)}" data-nav="notes" data-arg="p${p.n}" title="${esc(p.name)}"><span>${esc(p.short)}</span></button>`).join('');
  const sc = ps.map(p => `<span style="${fx(p)}">${p.from}</span>`).join('');
  return `<div class="ribbon"><div class="ribbon-bar">${bar}</div><div class="ribbon-scale">${sc}</div><p class="note">Длина периода на шкале примерно пропорциональна его продолжительности: от призвания Рюрика (862) до наших дней. Нажмите на период, чтобы открыть его главы.</p></div>`;
}
function scopeLabel(scope){
  if (scope.length === ALL_CH.length) return 'все 22 главы';
  if (scope.length === 1) return 'гл. '+scope[0];
  return scope.length + ' ' + plural(scope.length,'глава','главы','глав');
}
function scopePicker(opts){
  const withCats = opts && opts.cats;
  const periodChips = PER.map(p => {
    const chs = CHS.filter(c=>c.period===p.n).map(c=>c.chapter);
    const on = chs.every(x=>S.scope.includes(x));
    return `<button class="chip" type="button" aria-pressed="${on}" data-scope-period="${p.n}"><span class="dot" style="color:${pc(p.n)}"></span>${esc(p.short)}</button>`;
  }).join('');
  const chList = CHS.map(c=>`<label class="chk"><input type="checkbox" id="sc-ch-${c.chapter}" data-scope-ch="${c.chapter}" ${S.scope.includes(c.chapter)?'checked':''}><span><span class="mono muted">${c.chapter}.</span> ${esc(c.title)}</span></label>`).join('');
  const cats = withCats ? `<details ${opts.openCats?'open':''}><summary>Что учить <span class="v">${S.cats.length===CATS.length?'всё':S.cats.map(c=>CATL[c]).join(', ')}</span></summary><div class="body"><div class="row">${CATS.map(c=>`<button class="chip" type="button" aria-pressed="${S.cats.includes(c.id)}" data-cat="${c.id}">${c.label}</button>`).join('')}</div></div></details>` : '';
  return `<div class="scope">
    <details><summary>Главы учебника <span class="v">${scopeLabel(S.scope)}</span></summary>
      <div class="body">
        <div class="row">${periodChips}</div>
        <div class="row"><button class="btn ghost" type="button" data-scope-all>Выбрать все</button><button class="btn ghost" type="button" data-scope-none>Снять все</button></div>
        <div>${chList}</div>
      </div>
    </details>${cats}
  </div>`;
}
function bindScope(root, after){
  const keepOpen = () => [...root.querySelectorAll('.scope details')].map(d=>d.open);
  const restore = st => { const ds=[...root.querySelectorAll('.scope details')]; st.forEach((o,i)=>{ if(ds[i]) ds[i].open=o; }); };
  const rerender = () => { const st = keepOpen(); save(); after(); restore(st); };
  root.querySelectorAll('[data-scope-period]').forEach(b => b.onclick = () => {
    const n = +b.dataset.scopePeriod; const chs = CHS.filter(c=>c.period===n).map(c=>c.chapter);
    const on = chs.every(x=>S.scope.includes(x));
    S.scope = on ? S.scope.filter(x=>!chs.includes(x)) : [...new Set(S.scope.concat(chs))].sort((a,b)=>a-b);
    rerender();
  });
  root.querySelectorAll('[data-scope-ch]').forEach(i => i.onchange = () => {
    const n = +i.dataset.scopeCh;
    S.scope = i.checked ? [...new Set(S.scope.concat([n]))].sort((a,b)=>a-b) : S.scope.filter(x=>x!==n);
    rerender();
  });
  const all = root.querySelector('[data-scope-all]'); if (all) all.onclick = () => { S.scope = ALL_CH.slice(); rerender(); };

let session = null;
let openBlock = null;
function buildSession(){
  const deck = deckFor(S.scope, S.cats);
  if (!deck.length) return null;
  const now = Date.now();
  const scored = deck.map(c => {
    const b = S.box[c.key] || 0, seen = S.seen[c.key] || 0;
    // lower box first; among seen cards, older first; unseen cards mixed in
    const pri = b*10 + (seen ? Math.min(9, (now-seen)/3.6e6 < 1 ? 5 : 0) : 0.5) + Math.random()*3;
    return {c, pri};
  }).sort((a,b)=>a.pri-b.pri);
  const size = S.size === 0 ? scored.length : Math.min(S.size, scored.length);
  const q = scored.slice(0,size).map(x=>x.c);
  return {queue: shuffle(q.slice(0, Math.min(q.length, size))).sort((a,b)=>(S.box[a.key]||0)-(S.box[b.key]||0)), done:0, total:q.length, flipped:false, tally:{no:0,mid:0,yes:0}};
}
// сессия по стопке: порядок карточек – сюжетный (события по годам, затем люди, понятия, культура)
function buildBlockSession(b, mode){
  let cards = b.cards;
  if (mode === 'rest') cards = cards.filter(c => !learned(c));
  else if (mode === 'min') cards = cards.filter(c => CORE[150].has(c.key));
  if (!cards.length) cards = b.cards;
  return {queue: cards.slice(), done:0, total:cards.length, flipped:false, tally:{no:0,mid:0,yes:0}, block:b.n};
}
// сессия по топ-40: карточки вперемешку – по порядку времени дату слишком легко угадать по соседям
function buildTopSession(mode){
  let cards = TOP_CARDS;
  if (mode === 'rest') cards = cards.filter(c => !learned(c));
  if (!cards.length) cards = TOP_CARDS;
  return {queue: shuffle(cards), done:0, total:cards.length, flipped:false, tally:{no:0,mid:0,yes:0}, top:true};
}
// перемешать оставшиеся карточки сессии; открытая карточка остаётся на месте
const reshuffleFrom = () => session.flipped ? 1 : 0;
function reshuffleSession(){
  const k = reshuffleFrom();
  if (session.queue.length - k < 2) return;
  session.queue = session.queue.slice(0, k).concat(shuffle(session.queue.slice(k)));
  renderCards();
}

function poolEvents(scope){
  const seen = new Set(), out = [];
  CHS.forEach(ch => { if (!scope.includes(ch.chapter)) return; (ch.events||[]).forEach(e => { const k = norm(e.title); if (seen.has(k)) return; seen.add(k); out.push(Object.assign({ch:ch.chapter}, e)); }); });
  return out;
}
function poolOf(scope, key){
  const seen = new Set(), out = [];
  CHS.forEach(ch => { if (!scope.includes(ch.chapter)) return; (ch[key]||[]).forEach(x => { const k = norm(x.title||x.name||x.term||x.q); if (seen.has(k)) return; seen.add(k); out.push(Object.assign({ch:ch.chapter}, x)); }); });
  return out;
}

function mkMcq(q, correct, wrongs, explain, ch, src, extra){
  const opts = shuffle([correct].concat(wrongs));
  return Object.assign({type:'mcq', q, options:opts, answer:opts.indexOf(correct), explain, ch, src}, extra||{});
}

// и 10 вопросов с выбором ответа: 3 настоящих из варианта 26.06.26, «не при ком», правители и даты
function genTopTest(){
  const P = D.pastExam;
  const top = TOP.map((x, i) => Object.assign({i, c: CARD[x.key]}, x));
  const about = t => t.c.d.desc || t.c.d.def || '';
  // хронологии: карточки по времени режутся на отрезки по 8, отрезок случайно делится на две четвёрки –
  // пункты близки по времени, как на экзамене, а сочетания каждый раз новые
  const seqs = [];
  for (let s = 0; s + 8 <= top.length; s += 8){
    const part = shuffle(top.slice(s, s + 8));
    [part.slice(0, 4), part.slice(4)].forEach(g => {
      const first = g.reduce((a, b) => keyOf(a) <= keyOf(b) ? a : b);
      seqs.push({type:'seq', q:'Расположите в хронологической последовательности:', items:shuffle(g.map(t => ({t:t.c.title, d:t.d, y:t.y, m:t.m}))),
        ch:first.c.ch, src:'top:s:'+g.map(t => t.key).sort().join(',')});
    });
  }
  const qPast = i => { const m = P.mcq[i]; return mkMcq(m.q, m.options[m.answer], m.options.filter((o, j) => j !== m.answer), m.explain, m.ch, 'past:m'+i, m.img ? {img:m.img} : null); };
  // карточки, для которых в варианте есть свой вопрос, проверяются этим вопросом, а не «при ком»
  const hasOwnMcq = t => t.ex.some(e => e.n <= P.mcq.length);
  const qRuler = t => {
    const r = RUL[t.c.d.ruler];
    if (!r || hasOwnMcq(t) || (r.stem && t.c.title.includes(r.stem))) return null;
    const cand = D.rulers.filter((x, i) => x.id !== r.id && Math.abs(i - r.idx) <= 4 && !inReign(RUL[x.id], t.y) && !(x.stem && t.c.title.includes(x.stem)));
    if (cand.length < 3) return null;
    return mkMcq(`${t.c.title} – это произошло:`, 'при '+r.pr, shuffle(cand).slice(0, 3).map(x => 'при '+x.pr), `${t.c.d.date} – ${r.name} (${r.years}). ${about(t)}`, t.c.ch, 'top:r:'+t.key);
  };
  // даты-соседи из той же колоды: отличать приходится близкие годы и месяцы
  const qDate = t => mkMcq(`Укажите дату: ${t.c.title}`, t.d, shuffle(top.filter(o => o !== t && Math.abs(o.i - t.i) <= 4)).slice(0, 3).map(o => o.d),
    `${t.c.title} – ${t.c.d.date}. ${about(t)}`, t.c.ch, 'top:d:'+t.key);
  const qNotRuler = () => {
    const ev = top.filter(t => t.c.kind === 'event');
    const by = {};
    ev.forEach(t => { const r = RUL[t.c.d.ruler]; if (r && inReign(r, t.y)) (by[r.id] = by[r.id] || []).push(t); });
    for (const id of shuffle(Object.keys(by).filter(k => by[k].length >= 3))){
      const X = RUL[id], own = shuffle(by[id]).slice(0, 3);
      const odd = shuffle(ev.filter(t => t.c.d.ruler !== id && (t.y < X.fstart - 1 || t.y > X.end + 1) && !(X.stem && t.c.title.includes(X.stem)) && own.some(o => Math.abs(o.i - t.i) <= 4)))[0];
      if (!odd) continue;
      const or = RUL[odd.c.d.ruler];
      return mkMcq(`Какое событие произошло не при ${X.pr}?`, odd.c.title, own.map(t => t.c.title),
        `«${odd.c.title}» – ${odd.d}${or ? ', при '+or.pr : ''}. ${X.name} правил: ${X.years}. Остальное: ${own.map(t => t.c.title+' ('+t.d+')').join('; ')}.`, odd.c.ch, 'top:n:'+id+':'+odd.key);
    }
    return null;
  };
  const mcq = shuffle(P.mcq.map((m, i) => i)).slice(0, 3).map(qPast);
  const nr = qNotRuler(); if (nr) mcq.push(nr);
  const pool = shuffle(top), asked = new Set();
  for (const t of pool){ if (mcq.length >= 7) break; const q = qRuler(t); if (q){ mcq.push(q); asked.add(t.key); } }
  for (const t of pool){ if (mcq.length >= 10) break; if (!asked.has(t.key)) mcq.push(qDate(t)); }
  // как на экзамене: сначала вопросы с выбором ответа, затем хронологии
  return shuffle(mcq).concat(shuffle(seqs));
}
function genTest(scope, mode, n){
  const qs = [], seen = new Set();
  const sig = q => q.type==='seq' ? 'S|'+q.items.map(i=>norm(i.t)).sort().join('|') : 'M|'+q.q+'|'+q.options.slice().sort().join('|');
  const add = q => { if (!q) return false; const k = q.src || q.q, g = sig(q); if (seen.has(k) || seen.has(g)) return false; seen.add(k); seen.add(g); qs.push(q); return true; };
  if (mode==='top') return hasTop ? genTopTest() : [];
  if (mode==='past'){
    D.pastExam.mcq.forEach((m,i)=>add(Object.assign({type:'mcq', src:'past:m'+i}, m)));
    D.pastExam.seq.forEach((s,i)=>add({type:'seq', q:s.q, items:shuffle(s.items), ch:s.ch, src:'past:s'+i}));
    return qs.map(q => q.type==='mcq' ? Object.assign({}, q) : q);
  }
  if (mode==='wrong'){
    return shuffle(S.wrong).slice(0, 20).map(q => q.type==='seq' ? Object.assign({}, q, {items:shuffle(q.items)}) : q);
  }
  if (mode==='exam'){
    const mc = [['hand',55],['ruler',20],['notRuler',10],['linked',8],['look',7]];
    const sq = [['handSeq',60],['autoSeq',32],['cultSeq',8]];
    let guard=0; while (qs.filter(q=>q.type==='mcq').length<32 && guard++<800) add(G[weighted(mc)](scope));
    guard=0; while (qs.filter(q=>q.type==='seq').length<12 && guard++<400) add(G[weighted(sq)](scope));
    return qs;
  }
  let guard=0; while (qs.length<n && guard++<n*20) add(G[weighted(MIX)](scope));
  return shuffle(qs);
}

  const prompt = q.type==='mcq'
    ? `Вопрос экзамена: «${q.q}». Варианты: ${q.options.join('; ')}. Правильный ответ: ${q.options[q.answer]}. Ответ студента: ${q.options[st.sel]}. Пояснение: ${q.explain||''}. Объясни, почему верен правильный ответ и чем плохи остальные варианты.`
    : `Задание: «${q.q}». Правильный порядок: ${q.items.slice().sort((a,b)=>keyOf(a)-keyOf(b)).map(i=>i.t+' ('+i.d+')').join(' → ')}. Объясни каждое событие в одном-двух предложениях и как запомнить их порядок.`;
  h += aiSlot(prompt);
  h += `<button class="btn primary block" type="button" id="next">${test.i+1<test.qs.length?'Дальше':'Результат'}</button></div>`;
  return h;
}
function record(q, ok, given){
  test.answers.push({ok, given});
  const k = q.src || q.q;
  const idx = S.wrong.findIndex(w => (w.src||w.q)===k);
  if (!ok && idx<0){ S.wrong.push(q); if (S.wrong.length>200) S.wrong.shift(); }
  if (ok && idx>=0 && test.mode==='wrong') S.wrong.splice(idx,1);
  save();
}
function renderResults(){
  const n = test.answers.length, s = test.answers.filter(a=>a.ok).length;
  if (!test.saved && n){ S.tests.push({t:Date.now(), n, score:s, mode:test.mode}); if (S.tests.length>50) S.tests.shift(); save(); test.saved = true; }
  const pct = n ? Math.round(s/n*100) : 0;
  const mistakes = test.qs.map((q,i)=>({q, a:test.answers[i]})).filter(x=>x.a && !x.a.ok);
  $app.innerHTML = `<div class="stack" style="gap:18px">
    <span class="label">Результат теста</span>
    <div class="row" style="gap:18px;align-items:flex-end"><span class="score mono">${s}/${n}</span><span class="muted" style="padding-bottom:8px">${pct}% верно</span></div>
    <div class="bar"><i style="width:${pct}%;background:${pct>=70?'var(--good)':pct>=40?'var(--warn)':'var(--bad)'}"></i></div>
    <div class="row"><button class="btn primary" type="button" id="retry">${test.mode==='top'?'Ещё тест по топ-40':'Новый тест'}</button>${mistakes.length?'<button class="btn" type="button" id="wrongs">Разобрать ошибки заново</button>':''}<button class="btn" type="button" data-nav="cards">К карточкам</button></div>
    ${mistakes.length?`<div class="section"><h2>Ошибки</h2><div>${mistakes.map(({q,a})=>`<div class="mistake"><span class="mono muted" style="font-size:11.5px">гл. ${q.ch||'–'}</span><span class="qq">${esc(q.q)}</span>
      <span class="aa">${q.type==='mcq'?`Ваш ответ: <span style="color:var(--bad)">${esc(a.given)}</span><br>Верно: <b style="color:var(--good)">${esc(q.options[q.answer])}</b>`:`Верный порядок: ${q.items.slice().sort((x,y)=>keyOf(x)-keyOf(y)).map(i=>esc(i.t)+' <span class="mono muted" style="font-size:12px">'+esc(i.d)+'</span>').join(' → ')}`}</span></div>`).join('')}</div></div>`:'<p>Без ошибок. Отличная работа.</p>'}
  </div>`;
  document.getElementById('retry').onclick = () => {
    if (test.mode === 'top' && startTest('top')){ renderTest(); window.scrollTo({top:0}); return; }
    test = null; renderTest();
  };
  const w = document.getElementById('wrongs'); if (w) w.onclick = () => { startTest('wrong'); renderTest(); };
}
function renderTestSetup(){
  const hist = S.tests.slice(-5).reverse();
  $app.innerHTML = `<div class="stack" style="gap:18px">
    <div class="stack" style="gap:6px"><span class="label">Тест</span><h1>Проверка в формате экзамена</h1>
    <p class="muted">Очный тест: 60 минут, 44 задания, максимум 100 баллов. Вопрос с выбором ответа – 2 балла, задание на упорядочивание и соотнесение – 3 балла.</p></div>
    <div class="actions">
      <button class="action lead" type="button" data-test="exam"${hasTop?' style="grid-column:1/-1"':''}><span class="t">Как на экзамене</span><span class="d">44 задания: 32 с выбором ответа и 12 на хронологию. Все главы, 60 минут.</span></button>
      ${hasTop?`<button class="action" type="button" data-test="top"><span class="t">Тест по топ-40</span><span class="d">Только эти 40 карточек: хронологии в новых сочетаниях, даты, правители и вопросы варианта.</span></button>`:''}
      <button class="action" type="button" data-test="past"><span class="t">Вариант 26.06.26</span><span class="d">Настоящие вопросы прошлого экзамена.</span></button>
      <button class="action" type="button" data-test="wrong" ${S.wrong.length?'':'disabled style="opacity:.5"'}><span class="t">Работа над ошибками</span><span class="d">${S.wrong.length? S.wrong.length+' '+plural(S.wrong.length,'вопрос','вопроса','вопросов')+', где вы ошиблись.' : 'Здесь появятся вопросы, в которых вы ошиблись.'}</span></button>
      <button class="action" type="button" data-test="mix"><span class="t">Смешанный тест</span><span class="d">По выбранным ниже главам.</span></button>
    </div>
    <div class="section"><h3>Смешанный тест по главам</h3>
      ${scopePicker()}
      <div class="row"><span class="label" style="margin-right:4px">Вопросов</span>${[10,20,30,50].map(n=>`<button class="chip" type="button" aria-pressed="${(S.tn||20)===n}" data-tn="${n}">${n}</button>`).join('')}</div>
      <button class="btn primary block" type="button" data-test="mix" ${S.scope.length?'':'disabled'}>Начать смешанный тест · ${scopeLabel(S.scope)}</button>
    </div>
    ${hist.length?`<div class="section"><span class="label">Последние попытки</span><div class="evlist">${hist.map(h=>`<div><span class="dt">${new Date(h.t).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}</span><span>${{exam:'Как на экзамене',past:'Вариант 26.06.26',top:'Топ-40',wrong:'Работа над ошибками',mix:'Смешанный'}[h.mode]||'Тест'} – <b class="mono">${h.score}/${h.n}</b></span></div>`).join('')}</div></div>`:''}
  </div>`;
  bindScope($app, renderTestSetup);
  $app.querySelectorAll('[data-tn]').forEach(b=>b.onclick=()=>{ S.tn=+b.dataset.tn; save(); renderTestSetup(); });
  $app.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{
    const m = b.dataset.test;
    const ok = m==='exam' ? startTest('exam',14,ALL_CH) : m==='past' ? startTest('past') : m==='top' ? startTest('top') : m==='wrong' ? startTest('wrong') : startTest('mix', S.tn||20);
    if (ok) renderTest();
  });
}

/* ---------- RULERS ---------- */
let openRuler = null;
function renderRulers(){
  const html = PER.filter(p=>p.from).map(p => {
    const rs = D.rulers.filter(r=>r.period===p.n);
    return `<section class="tl-period" style="--pc:${pc(p.n)}"><header><span class="sw" style="background:${pc(p.n)}"></span><h3>${esc(p.name)}</h3></header>
      <div class="tl-list">${rs.map(r => {
        const evs = rulerEvents[r.id]||[]; const open = openRuler===r.id;
        return `<div class="ruler"><button type="button" data-ruler="${r.id}" aria-expanded="${open}"><span class="yrs">${esc(r.years)}</span><span class="nm">${esc(r.name)}</span><span class="cnt">${evs.length}</span></button>
          ${open?`<div class="more"><p class="muted" style="font-size:13.5px">${esc(r.title)}</p>${(rulerNotes[r.id]||[]).slice(0,1).map(t=>`<p style="font-size:14.5px">${esc(t)}</p>`).join('')}
            ${evs.length?`<div class="evlist">${evs.map(e=>`<div><span class="dt">${esc(e.date)}</span><span>${esc(e.title)}<span class="ty">${e.type==='foreign'?'внеш.':'внутр.'} · гл. ${e.ch}</span></span></div>`).join('')}</div>`:'<p class="note">В базе нет отдельных событий этого правления.</p>'}</div>`:''}</div>`;
      }).join('')}</div></section>`;
  }).join('');
  $app.innerHTML = `<div class="stack" style="gap:18px"><div class="stack" style="gap:6px"><span class="label">Исторические периоды по правителям</span><h1>Лента правителей</h1>
    <p class="muted">Нажмите на имя: откроются все события его правления из базы. Цифра справа – сколько событий.</p></div>
    <div class="row"><button class="btn" type="button" id="rq">Тест «при каком правителе»</button></div>
    <div class="tl">${html}</div></div>`;
  $app.querySelectorAll('[data-ruler]').forEach(b=>b.onclick=()=>{ openRuler = openRuler===b.dataset.ruler ? null : b.dataset.ruler; const y = b.getBoundingClientRect().top; renderRulers(); const nb = $app.querySelector(`[data-ruler="${openRuler||b.dataset.ruler}"]`); if (nb) window.scrollBy(0, nb.getBoundingClientRect().top - y); });
  document.getElementById('rq').onclick = () => {
    const qs = []; const seen = new Set(); let g=0;
    while (qs.length<15 && g++<300){ const q = Math.random()<.75 ? G.ruler(ALL_CH) : G.notRuler(ALL_CH); if (q && !seen.has(q.src)){ seen.add(q.src); qs.push(q); } }
    test = {mode:'mix', qs, i:0, answers:[], state:null, scope:ALL_CH}; nav('test');
  };
}

/* ---------- NOTES ---------- */
let searchQ = '';
function renderNotes(){
  const a = viewArg;
  if (typeof a === 'number' && CHN[a]) return renderChapter(CHN[a]);
  const onlyP = typeof a === 'string' && a[0]==='p' ? +a.slice(1) : null;
  const list = PER.filter(p=>onlyP===null || p.n===onlyP).map(p => {
    const chs = CHS.filter(c=>c.period===p.n); if (!chs.length) return '';
    return `<div class="section" style="gap:8px"><div class="period-head"><span class="sw" style="background:${pc(p.n)}"></span><h3>${esc(p.name)}</h3></div>
      <div class="chlist">${chs.map(c=>`<button class="chrow" type="button" data-nav="notes" data-arg="${c.chapter}"><span class="n">Гл. ${c.chapter}</span><span class="ti">${esc(c.title)}</span><span class="pr"><small>${(c.events||[]).length+(c.culture||[]).length} фактов</small></span></button>`).join('')}</div></div>`;
  }).join('');
  $app.innerHTML = `<div class="stack" style="gap:18px"><div class="stack" style="gap:6px"><span class="label">Конспекты и справочник</span><h1>${onlyP!==null?esc(PER[onlyP].name):'Главы учебника'}</h1></div>
    <label class="search" for="q"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Поиск: Уложение, Сперанский, 1653, Растрелли…" value="${esc(searchQ)}" autocomplete="off"></label>
    <div id="results"></div>
    ${onlyP!==null?'<button class="btn ghost back-link" type="button" data-nav="notes">← Все периоды</button>':''}
    <div class="stack" id="chlist">${list}</div></div>`;
  const inp = document.getElementById('q');
  const run = () => { searchQ = inp.value; const r = document.getElementById('results'); const cl = document.getElementById('chlist');
    const q = norm(searchQ); if (q.length<2){ r.innerHTML=''; cl.hidden=false; return; } cl.hidden = true;
    const hits = [];
    CARDS.forEach(c => { if (c.kind==='ruler') return; const d = c.d; const hay = norm([c.title, d.date, d.desc, d.role, d.def, d.author, (d.facts||[]).join(' ')].join(' ')); if (hay.includes(q)) hits.push(c); });
    const uniq = []; const s = new Set(); hits.forEach(h=>{ const k=h.kind+norm(h.title); if(!s.has(k)){ s.add(k); uniq.push(h); } });
    r.innerHTML = uniq.length ? `<p class="note">Найдено: ${uniq.length}</p><div class="items">${uniq.slice(0,80).map(itemRow).join('')}</div>` : '<p class="empty">Ничего не найдено. Попробуйте другое слово или год.</p>';
  };
  inp.oninput = run; if (searchQ) run();
}
function itemRow(c){
  const d = c.d; const r = RUL[d.ruler];
  const sub = c.kind==='event' ? `${esc(d.desc)}${r?` <span class="muted">(${esc(r.name)})</span>`:''}` : c.kind==='person' ? esc(d.role) : c.kind==='culture' ? `${d.author?esc(d.author)+'. ':''}${esc(d.desc)}` : esc(d.def);
  return `<div class="item"><div class="h"><span class="tag"><span class="sw" style="background:${chColor(c.ch)}"></span>${esc(c.kind==='culture'?d.kind:CATL[c.cat])} · гл. ${c.ch}</span></div><div class="h"><b>${esc(c.title)}</b>${d.date?`<span class="dt">${esc(d.date)}</span>`:''}</div><div class="x">${sub}</div></div>`;
}
function renderChapter(ch){
  const n = ch.chapter;
  const st = chapterStats(n);
  const evs = (ch.events||[]).slice().sort((a,b)=>(a.year-b.year)||((a.month||0)-(b.month||0)));
  const sec = (title, count, inner, open) => `<details class="sec" ${open?'open':''}><summary><h3>${title}</h3><span class="c">${count}</span></summary>${inner}</details>`;
  const evRows = list => `<div class="evlist" style="margin-bottom:12px">${list.map(e=>{ const r=RUL[e.ruler]; return `<div><span class="dt">${esc(e.date)}</span><span><b style="font-weight:600">${esc(e.title)}</b>${r?` <span class="muted" style="font-size:12.5px">· ${esc(r.name)}</span>`:''}<br><span class="muted" style="font-size:13.5px">${esc(e.desc)}</span></span></div>`; }).join('')}</div>`;
  const internal = evs.filter(e=>e.type==='internal'), foreign = evs.filter(e=>e.type==='foreign');
  const rulersHere = [...new Set(evs.map(e=>e.ruler))].filter(id=>RUL[id]).map(id=>RUL[id]).sort((a,b)=>a.idx-b.idx);
  $app.innerHTML = `<div class="stack" style="gap:16px">
    <button class="btn ghost back-link" type="button" data-nav="notes">← Все главы</button>
    <div class="stack" style="gap:6px"><span class="tag"><span class="sw" style="background:${pc(ch.period)}"></span>${esc(PER[ch.period].name)} · глава ${n}</span><h1>${esc(ch.title)}</h1></div>
    <div class="row"><button class="btn primary" type="button" id="chCards">Карточки главы · ${st.total}</button><button class="btn" type="button" data-nav="test" data-arg="ch${n}">Тест по главе</button></div>
    <div class="bar"><i style="width:${st.total?st.learned/st.total*100:0}%;background:${pc(ch.period)}"></i></div>
    <p class="note">Выучено ${st.learned} из ${st.total} карточек главы.</p>
    <section class="summary"><span class="label">Конспект</span>${(ch.summary||[]).map(p=>`<p>${md(p)}</p>`).join('')}</section>
    <div>
    ${rulersHere.length?sec('Правители', rulersHere.length, `<div class="evlist" style="margin-bottom:12px">${rulersHere.map(r=>`<div><span class="dt">${esc(r.years)}</span><span><b style="font-weight:600">${esc(r.name)}</b>${(ch.ruler_notes||{})[r.id]?`<br><span class="muted" style="font-size:13.5px">${esc(ch.ruler_notes[r.id])}</span>`:''}</span></div>`).join('')}</div>`):''}
    ${internal.length?sec('Внутренняя политика', internal.length, evRows(internal)):''}
    ${foreign.length?sec('Внешняя политика', foreign.length, evRows(foreign)):''}
    ${(ch.people||[]).length?sec('Персоны', ch.people.length, `<div class="items">${ch.people.map(p=>`<div class="item"><div class="h"><b>${esc(p.name)}</b></div><div class="x">${esc(p.role)}${(p.facts||[]).length?'. '+esc(p.facts.join('; '))+'.':''}</div></div>`).join('')}</div>`):''}
    ${(ch.culture||[]).length?sec('Культура', ch.culture.length, `<div class="items">${ch.culture.slice().sort((a,b)=>(a.year||0)-(b.year||0)).map(c=>`<div class="item"><div class="h"><b>${esc(c.title)}</b><span class="dt">${esc(c.date||'')}</span></div><div class="x">${c.author?'<b style="font-weight:500">'+esc(c.author)+'.</b> ':''}${esc(c.desc)}${c.linked?' <span class="muted">Связано с: '+esc(c.linked)+'.</span>':''}</div></div>`).join('')}</div>`):''}
    ${(ch.terms||[]).length?sec('Понятия', ch.terms.length, `<div class="items">${ch.terms.map(t=>`<div class="item"><div class="h"><b>${esc(t.term)}</b>${t.date?`<span class="dt">${esc(t.date)}</span>`:''}</div><div class="x">${esc(t.def)}</div></div>`).join('')}</div>`):''}
    </div>
    <div class="row">${n>1?`<button class="btn" type="button" data-nav="notes" data-arg="${n-1}">← Гл. ${n-1}</button>`:''}${n<22?`<button class="btn" type="button" data-nav="notes" data-arg="${n+1}" style="margin-left:auto">Гл. ${n+1} →</button>`:''}</div>
  </div>`;
  document.getElementById('chCards').onclick = () => { S.scope = [n]; S.cats = CATS.map(c=>c.id); save(); session = buildSession(); nav('cards'); };
}

/* ---------- render ---------- */
function render(){
  renderNav();
  if (view==='home') renderHome();
  else if (view==='cards') renderCards();
  else if (view==='test'){ if (viewArg){ test = null; } renderTest(); }
  else if (view==='rulers') renderRulers();
  else if (view==='notes') renderNotes();
}
const coreHash = () => { const m = /^#core(150|300)$/.exec(location.hash||''); return m ? +m[1] : 0; };
const topHash = () => location.hash === '#top40';
window.addEventListener('hashchange', () => { if (topHash()) return openTop(); const k = coreHash(); if (k) startCore(k); });
const k0 = coreHash();
if (hasTop && topHash()) openTop(); else if (hasCore && k0) startCore(k0); else render();
})();
</script>

</body>
</html>
